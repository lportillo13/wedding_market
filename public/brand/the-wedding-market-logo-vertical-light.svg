<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 880" role="img" aria-labelledby="title desc">
  <title id="title">The Wedding Market vertical logo, light</title>
  <desc id="desc">A letter-only vertical logo for The Wedding Market using black, white, and gold.</desc>
  <rect width="760" height="880" fill="#ffffff"/>
  <g transform="translate(151 108)">
    <text x="226" y="74" fill="#b8922a" font-family="Georgia, 'Times New Roman', serif" font-size="44" font-weight="700" letter-spacing="0" text-anchor="middle">THE</text>
    <text x="0" y="330" fill="#09090f" font-family="Georgia, 'Times New Roman', serif" font-size="286" font-weight="400" letter-spacing="0">W</text>
    <text x="214" y="330" fill="#09090f" font-family="Georgia, 'Times New Roman', serif" font-size="276" font-style="italic" font-weight="400" letter-spacing="0">M</text>
    <path d="M344 34 C310 134 272 233 232 355" fill="none" stroke="#b8922a" stroke-width="8" stroke-linecap="round"/>
