    <text x="0" y="214" fill="#09090f" font-family="Georgia, 'Times New Roman', serif" font-size="68" font-weight="400" letter-spacing="0">MARKET</text>
    <path d="M392 35 H720" fill="none" stroke="#b8922a" stroke-width="4" stroke-linecap="round"/>
    <path d="M392 178 H720" fill="none" stroke="#b8922a" stroke-width="4" stroke-linecap="round"/>
  </g>
